<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dynamics editor frame fixture</title>
    <style>
      :root { color-scheme: light; font: 14px/1.45 "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 12px; background: #fff; color: #242424; }
      label { display: block; margin-bottom: 6px; font-weight: 600; }
      [contenteditable] {
        min-height: 104px;
        padding: 10px 12px;
        overflow-wrap: anywhere;
        border: 1px solid #8a8886;
        border-radius: 2px;
        outline: none;
        white-space: pre-wrap;
      }
      [contenteditable]:focus { border-color: #0f6cbd; box-shadow: inset 0 0 0 1px #0f6cbd; }
      [contenteditable]:empty::before { color: #605e5c; content: attr(data-placeholder); pointer-events: none; }
      output { display: block; margin-top: 8px; color: #605e5c; font-size: 12px; }
    </style>
  </head>
  <body>
    <label for="frame-editor">Internal notes</label>
    <div
      id="frame-editor"
      role="textbox"
      aria-label="Internal notes rich text frame"
      aria-multiline="true"
      contenteditable="true"
      data-placeholder="Type an internal note…"
    ></div>
    <output id="frame-status">Frame editor ready</output>
    <script>
      const editor = document.getElementById("frame-editor");
      const status = document.getElementById("frame-status");
      const caseId = new URLSearchParams(location.search).get("case") || "internal-notes-frame";

      function report(type, event) {
        status.textContent = `${type} · ${event?.inputType || "no inputType"}`;
        parent.postMessage({
          source: "zen-dynamics-frame",
          caseId,
          type,
          tag: event?.target?.tagName || "DIV",
          trusted: Boolean(event?.isTrusted),
          inputType: event?.inputType || "",
        }, "*");
      }

      editor.addEventListener("focus", (event) => report("focus", event));
      editor.addEventListener("beforeinput", (event) => report("beforeinput", event));
      editor.addEventListener("input", (event) => report("input", event));
      window.addEventListener("message", (event) => {
        if (event.data?.type !== "zen-dynamics-reset") return;
        editor.replaceChildren();
        status.textContent = "Frame editor ready";
      });

      window.__dynamicsFrame = {
        focus: () => editor.focus(),
        reset: () => editor.replaceChildren(),
        value: () => editor.innerText,
      };
    </script>
  </body>
</html>
